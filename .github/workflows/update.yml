name: 更新資料並部署

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_questions:
        description: "強制重新產生今日 3 問 (1=是)"
        required: false
        default: "0"
  schedule:
    # 平日每 30 分鐘（UTC）；GitHub 排程可能延遲數分鐘
    - cron: "7,37 * * * 1-5"
    # 週末每 3 小時（加密貨幣仍在交易）
    - cron: "17 */3 * * 0,6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: 離線單元測試（公式與比對邏輯）
        run: python scripts/test_pipeline.py

      - name: 抓取資料 + 交叉比對 + 產生提問
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_QUESTIONS: ${{ github.event.inputs.force_questions }}
        run: python scripts/build_data.py --out public/data --archive data

      - name: 保存每日提問歸檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: questions/cache $(date -u +%F)"
            git pull --rebase --autostash || true
            git push || echo "push 失敗（下次會重試）"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
